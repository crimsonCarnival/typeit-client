<div class="account-page">
  @if (loading()) {
    <div class="page-loading">Loading&#8230;</div>
  } @else {
    <div class="profile-card stats-card-wide">
      <h2 class="profile-title">Statistics</h2>
      <app-stats-sections [stats]="user()?.stats ?? null" [overall]="overall()" [averages]="averages()" />
    </div>

    <div class="profile-card stats-card-wide">
      @if (historyLoading()) {
        <div class="history-loading">Loading history&#8230;</div>
      } @else {
        <app-session-history-chart [sessions]="sessions()" />
      }
    </div>
  }
</div>
