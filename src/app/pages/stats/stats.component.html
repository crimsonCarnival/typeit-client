<div class="stats-page">
  <h1 class="title">Statistics</h1>
  @if (loading()) {
    <div class="state" aria-busy="true">Loading&#8230;</div>
  } @else {
    <app-stats-sections [stats]="user()?.stats ?? null" [overall]="overall()" [averages]="averages()">
      <section class="history-card">
        @if (historyLoading()) {
          <div class="state" aria-busy="true">Loading history&#8230;</div>
        } @else {
          <app-session-history-chart [sessions]="sessions()" />
        }
      </section>
    </app-stats-sections>
  }
</div>
