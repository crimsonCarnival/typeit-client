<header class="app-header" [class.focus]="focusMode()">
  <div class="app-header-left">
    <a class="app-logo" routerLink="/" aria-label="TypeIt home">
      <span class="app-logo-word">TYPE<span class="app-logo-accent">IT</span></span>
      <span class="app-logo-caret" aria-hidden="true"></span>
    </a>

    @if (focusMode()) {
      <span class="focus-label">Focus mode</span>
    }
    <nav class="app-nav" aria-label="Primary">
      <a class="app-nav-link" routerLink="/play" routerLinkActive="active" ariaCurrentWhenActive="page">Play</a>
      <a class="app-nav-link" routerLink="/daily" routerLinkActive="active" ariaCurrentWhenActive="page">Daily</a>
      <a class="app-nav-link" routerLink="/race" routerLinkActive="active" ariaCurrentWhenActive="page">Race</a>
      <a class="app-nav-link" routerLink="/ranks" routerLinkActive="active" ariaCurrentWhenActive="page">Ranks</a>
      <a class="app-nav-link" routerLink="/learn" routerLinkActive="active" ariaCurrentWhenActive="page">Learn</a>
      @if (auth.isAuthenticated()) {
        <!-- Statistics lives in the account menu, as in the design. -->
        <a class="app-nav-link" routerLink="/profile" routerLinkActive="active" ariaCurrentWhenActive="page">Profile</a>
      }
    </nav>
  </div>

  <div class="app-header-right">
    <a class="app-search" routerLink="/players" routerLinkActive="active" aria-label="Find players" title="Find players">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
    </a>
    <app-user-menu />
  </div>
</header>

<main class="app-main">
  <router-outlet />
</main>

@if (race.invite(); as invite) {
  <div class="invite-toast" role="alert">
    <span><b>{{ invite.from.displayName }}</b> invited you to race in <b>{{ invite.name }}</b></span>
    <button type="button" class="invite-accept" (click)="acceptInvite()">Join</button>
    <button type="button" class="invite-dismiss" aria-label="Dismiss invite" (click)="race.invite.set(null)">&#10005;</button>
  </div>
}

@if (auth.authModal(); as mode) {
  <app-auth-modal [initialMode]="mode" (close)="auth.closeAuthModal()" />
}
