<section class="track" aria-label="Race track">
  <div class="track-labels" aria-hidden="true"><span>Start</span><span>Finish</span></div>
  @for (lane of lanes(); track lane.id) {
    <div
      class="lane"
      role="progressbar"
      [attr.aria-label]="lane.label"
      aria-valuemin="0"
      aria-valuemax="100"
      [attr.aria-valuenow]="clamp(lane.progress) * 100 | number: '1.0-0'"
      [style.--p]="clamp(lane.progress)"
      [style.--lane-color]="lane.color"
    >
      <div class="lane-rail"></div>
      <div class="lane-fill"></div>
      <span class="lane-puck" [class.me]="lane.me" aria-hidden="true">{{ lane.initial }}</span>
      <div class="lane-finish" aria-hidden="true"></div>
    </div>
  }
</section>
