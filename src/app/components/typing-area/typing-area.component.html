<div
  class="typing-text"
  [class.blurred]="!isFocused"
  [class.focused]="isFocused"
  [class.cursor-idle]="cursorIdle()"
  [attr.data-caret]="caretStyle()"
  (click)="onContainerClick()"
>
  @if (!isFocused) {
    <div class="focus-overlay">
      <button type="button" class="start-btn" (click)="onContainerClick()">
        <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"></rect><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"></path></svg>
        <span class="label-pointer">Click or press any key to start</span>
        <span class="label-touch">Tap to start typing</span>
      </button>
    </div>
  }
  <p #textDisplay translate="no">
    @for (char of characters(); track $index) {
      @if (char.char === '\n') {
        <span [class]="charClass(char, $index) + ' nl'">&#8629;</span><br />
      } @else {
        <span [class]="charClass(char, $index)">{{ char.char }}</span>
      }
    }
    @for (m of ghostMarks(); track m.ghosts[0].id) {
      <i class="ghost" aria-hidden="true" [style.left.px]="m.left" [style.top.px]="m.top" [style.height.px]="m.height" [style.--ghost]="m.ghosts[0].color">
        <b class="ghost-tips">
          @for (g of m.ghosts; track g.id) {
            <u class="ghost-tip" [style.--ghost]="g.color">{{ g.label }}</u>
          }
        </b>
      </i>
    }
  </p>
  <input
    #input
    type="text"
    class="input-field hidden-input"
    [value]="inputValue()"
    (beforeinput)="onBeforeInput($event)"
    (input)="onInput($event)"
    (compositionstart)="onCompositionStart()"
    (compositionend)="onCompositionEnd($event)"
    autocomplete="off"
    autocapitalize="off"
    spellcheck="false"
    (keydown.enter)="onEnter($event)"
    (keydown.shift.enter)="onEnter($event)"
    (focus)="onFocus()"
    (blur)="onBlur()"
  />
</div>
