<div class="tb-section">
  <span class="tb-label" aria-hidden="true">Mode</span>
  <div class="tb-buttons" role="group" aria-label="Mode">
    <button type="button" class="tb-btn" [class.active]="gameMode() === 'phrases'" [attr.aria-pressed]="gameMode() === 'phrases'" [disabled]="isTyping()" (click)="handleModeSelect('phrases')">Phrases</button>
    <button type="button" class="tb-btn" [class.active]="gameMode() === 'words'" [attr.aria-pressed]="gameMode() === 'words'" [disabled]="isTyping()" (click)="handleModeSelect('words')">Words</button>
  </div>
</div>
