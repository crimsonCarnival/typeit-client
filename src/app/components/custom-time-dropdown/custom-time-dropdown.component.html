<div class="tb-section time-control-wrapper" [class.is-locked]="locked()" [attr.title]="locked() ? lockedReason() : null">
  @if (isTyping() && !locked()) {
    <span class="tb-label" aria-hidden="true">Time left</span>
    <div class="tb-buttons">
      <span class="time-left" role="timer" aria-live="off">{{ timeLeft() }}s</span>
    </div>
  } @else {
    <span class="tb-label" aria-hidden="true">Time limit{{ locked() ? ' · n/a' : '' }}</span>
    <div class="tb-buttons" role="group" aria-label="Time limit in seconds">
      @for (time of PRESET_TIMES; track time) {
        <button type="button" class="tb-btn" [class.active]="!locked() && timeMax() === time" [attr.aria-pressed]="timeMax() === time" [disabled]="disabled() || locked()" (click)="handleTimeSelect(time)">{{ time }}</button>
      }
      @if (showCustomInput()) {
        <form (submit)="handleCustomSubmit($event)">
          <input
            #customInput
            type="number"
            min="10"
            max="600"
            class="tb-input"
            aria-label="Custom time limit in seconds (10 to 600)"
            placeholder="10-600"
            [value]="customValue()"
            (input)="onCustomInput($event)"
            (keydown)="handleCustomKeyDown($event)"
          />
        </form>
      } @else if (isCustomTime()) {
        <button type="button" class="tb-btn tb-custom" [class.active]="!locked()" aria-pressed="true" aria-label="Custom time limit, change" [disabled]="disabled() || locked()" (click)="handleCustomClick($event)">{{ timeMax() }}</button>
      } @else {
        <button type="button" class="tb-btn tb-icon" aria-label="Custom time limit" title="Custom time limit" [disabled]="disabled() || locked()" (click)="handleCustomClick($event)">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg>
        </button>
      }
    </div>
  }
</div>
