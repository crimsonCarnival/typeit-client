<div class="shortcuts-footer">
  @if (isVisible()) {
    <span class="hotkey-item"><kbd>Esc</kbd> New text</span>
    <span class="hotkey-item"><kbd>Tab</kbd> Restart same</span>
    <span class="hotkey-item"><kbd>M</kbd> Mute</span>
  }
  <button
    type="button"
    class="hotkey-item hotkey-toggle"
    [attr.aria-expanded]="isVisible()"
    (click)="toggleVisible()"
  >
    <kbd>?</kbd> {{ isVisible() ? 'Hide shortcuts' : 'Shortcuts' }}
  </button>
</div>
