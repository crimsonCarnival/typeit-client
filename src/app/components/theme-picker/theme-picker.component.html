<div class="overlay" (click)="cancel()">
  <div class="picker" role="dialog" aria-modal="true" aria-label="Choose a theme" (click)="$event.stopPropagation()" (keydown)="onKeydown($event)">
    <label class="search">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input
        #search
        type="text"
        placeholder="Theme..."
        autocomplete="off"
        spellcheck="false"
        role="combobox"
        aria-expanded="true"
        aria-controls="theme-list"
        [attr.aria-activedescendant]="results()[active()] ? 'theme-' + results()[active()].id : null"
        [value]="query()"
        (input)="onQuery($event)"
      />
    </label>
    <ul #list id="theme-list" class="list" role="listbox" aria-label="Themes" (mouseleave)="restore()">
      @for (t of results(); track t.id; let i = $index) {
        <li
          [id]="'theme-' + t.id"
          role="option"
          class="item"
          [attr.data-index]="i"
          [class.active]="i === active()"
          [attr.aria-selected]="t.id === current()"
          (mouseenter)="hover(i)"
          (click)="choose(t)"
        >
          <span class="name">{{ t.name }}{{ t.id === current() ? ' ✓' : '' }}</span>
          <span class="swatch" aria-hidden="true" [style.background]="t.bg">
            <i [style.background]="t.main"></i><i [style.background]="t.sub"></i><i [style.background]="t.text"></i>
          </span>
        </li>
      } @empty {
        <li class="empty">No theme matches.</li>
      }
    </ul>
  </div>
</div>
