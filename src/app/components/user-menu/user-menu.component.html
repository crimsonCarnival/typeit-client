@if (!isAuthenticated()) {
  <div class="user-menu-guest">
    <button type="button" class="btn btn-secondary" (click)="auth.openAuthModal('login')">Log in</button>
    <button type="button" class="btn btn-primary" (click)="auth.openAuthModal('register')">Sign up</button>
  </div>
} @else {
  <div class="user-menu">
    <button
      type="button"
      class="user-menu-trigger"
      aria-haspopup="menu"
      [attr.aria-expanded]="isOpen"
      (click)="toggleOpen()"
    >
      @if (user()?.avatar) {
        <img [src]="user()?.avatar" [alt]="user()?.username" class="user-avatar" />
      } @else {
        <span class="user-avatar user-avatar-placeholder" aria-hidden="true">{{ initial() }}</span>
      }
      <span class="user-menu-username">{{ displayName() }}</span>
      <svg
        class="user-menu-chevron"
        [class.open]="isOpen"
        aria-hidden="true"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.4"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="m6 9 6 6 6-6"></path>
      </svg>
    </button>

    @if (isOpen) {
      <div class="user-menu-backdrop" (click)="closeMenu()"></div>
      <div class="user-menu-dropdown" role="menu" aria-label="Account">
        <div class="user-menu-header">
          @if (user()?.avatar) {
            <img [src]="user()?.avatar" [alt]="user()?.username" class="user-avatar user-avatar-lg" />
          } @else {
            <span class="user-avatar user-avatar-placeholder user-avatar-lg" aria-hidden="true">{{ initial() }}</span>
          }
          <div class="user-menu-info">
            <span class="user-menu-name">{{ displayName() }}</span>
            <span class="user-menu-handle">&#64;{{ user()?.username }}</span>
          </div>
        </div>

        <div class="user-menu-stats">
          <div class="user-stat">
            <span class="user-stat-value">{{ user()?.stats?.gamesPlayed || 0 }}</span>
            <span class="user-stat-label">Games</span>
          </div>
          <div class="user-stat">
            <span class="user-stat-value user-stat-value-wpm">{{ user()?.stats?.bestWpm || 0 }}</span>
            <span class="user-stat-label">Best WPM</span>
          </div>
          <div class="user-stat">
            <span class="user-stat-value">{{ user()?.stats?.highScore || 0 }}</span>
            <span class="user-stat-label">High score</span>
          </div>
        </div>

        <div class="user-menu-section">
          <button type="button" role="menuitem" class="user-menu-item" (click)="goTo('/profile')">
            <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M4 21a8 8 0 0 1 16 0"></path>
            </svg>
            Profile
          </button>
          <button type="button" role="menuitem" class="user-menu-item" (click)="goTo('/stats')">
            <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 3v18h18"></path>
              <path d="m7 15 4-4 3 3 5-6"></path>
            </svg>
            Statistics
          </button>
          <button type="button" role="menuitem" class="user-menu-item" (click)="goTo('/achievements')">
            <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="9" r="6"></circle>
              <path d="m8.5 14-1.5 8 5-3 5 3-1.5-8"></path>
            </svg>
            Achievements
          </button>
          <button type="button" role="menuitem" class="user-menu-item" (click)="closeMenu()">
            <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M12 2v3M12 19v3M4.9 4.9 7 7M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"></path>
            </svg>
            Settings
          </button>
        </div>

        <div class="user-menu-section">
          <button type="button" role="menuitem" class="user-menu-item user-menu-logout" (click)="logout()">
            <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <path d="m16 17 5-5-5-5M21 12H9"></path>
            </svg>
            Log out
          </button>
        </div>
      </div>
    }
  </div>
}
