@if (!isAuthenticated()) {
  <div class="user-menu-guest">
    <button class="user-menu-login-btn" (click)="loginClick()?.()">
      Login
    </button>
    <button class="user-menu-register-btn" (click)="registerClick()?.()">
      Sign Up
    </button>
  </div>
} @else {
  <div class="user-menu">
    <button class="user-menu-trigger" (click)="toggleOpen()" [attr.aria-expanded]="isOpen">
      @if (user()?.avatar) {
        <img [src]="user()?.avatar" [alt]="user()?.username" class="user-avatar" />
      } @else {
        <div class="user-avatar-placeholder">
          {{ initial() }}
        </div>
      }
      <span class="user-menu-username">{{ displayName() }}</span>
      <svg
        class="user-menu-chevron"
        [class.open]="isOpen"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        strokeWidth="2"
      >
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>

    @if (isOpen) {
      <div class="user-menu-backdrop" (click)="closeMenu()"></div>
      <div class="user-menu-dropdown">
        <div class="user-menu-header">
          <div class="user-menu-info">
            <span class="user-menu-name">{{ displayName() }}</span>
            <span class="user-menu-email">&#64;{{ user()?.username }}</span>
          </div>
        </div>

        <div class="user-menu-stats">
          <div class="user-stat">
            <span class="user-stat-value">{{ user()?.stats?.gamesPlayed || 0 }}</span>
            <span class="user-stat-label">Games</span>
          </div>
          <div class="user-stat">
            <span class="user-stat-value">{{ user()?.stats?.bestWpm || 0 }}</span>
            <span class="user-stat-label">Best WPM</span>
          </div>
          <div class="user-stat">
            <span class="user-stat-value">{{ user()?.stats?.highScore || 0 }}</span>
            <span class="user-stat-label">High Score</span>
          </div>
        </div>

        <div class="user-menu-divider"></div>



        <button class="user-menu-item" (click)="goTo('/profile')">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          Profile
        </button>

        <button class="user-menu-item" (click)="goTo('/stats')">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
          Statistics
        </button>

        <button class="user-menu-item" (click)="closeMenu()">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          Settings
        </button>

        <div class="user-menu-divider"></div>

        <button class="user-menu-item user-menu-logout" (click)="logout()">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          Logout
        </button>
      </div>
    }
  </div>
}
