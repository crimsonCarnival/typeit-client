<button
  type="button"
  class="refresh-btn"
  aria-label="New text"
  title="New text (Esc)"
  [disabled]="disabled()"
  (click)="handleClick()"
>
  <svg
    aria-hidden="true"
    [class.spin]="isSpinning"
    (animationend)="handleAnimationEnd()"
    width="26"
    height="26"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path>
    <path d="M3 3v5h5"></path>
  </svg>
</button>
