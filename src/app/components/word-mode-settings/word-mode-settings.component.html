@if (gameMode() === 'words') {
  <div class="tb-section">
    <span class="tb-label" aria-hidden="true">Modifiers</span>
    <div class="tb-buttons" role="group" aria-label="Modifiers">
      <button type="button" class="tb-btn mono" [class.active]="punctuationEnabled()" [attr.aria-pressed]="punctuationEnabled()" aria-label="Punctuation" title="Punctuation" [disabled]="disabled()" (click)="onPunctuation()">.?!</button>
      <button type="button" class="tb-btn mono" [class.active]="numbersEnabled()" [attr.aria-pressed]="numbersEnabled()" aria-label="Numbers" title="Numbers" [disabled]="disabled()" (click)="onNumbers()">123</button>
    </div>
  </div>
}
