@if (gameMode() === 'words') {
  <div
    class="horizontal-wordcount-dropdown"
    [class.open]="isOpen()"
    [class.disabled]="isTyping()"
  >
    <div
      class="wordcount-icon toggle-icon"
      [class.active]="isOpen()"
      (click)="toggleIcon($event)"
      aria-describedby="word-count-tooltip"
      data-tooltip-id="word-count-tooltip"
    >
      <i class="fa-solid fa-align-left"></i>
      @if (!isOpen()) {
        <span class="ctrl-label">Words</span>
        <span class="control-value">{{ wordCount() }}</span>
      }
    </div>

    <div #tooltipEl id="word-count-tooltip" class="mdc-tooltip" role="tooltip" aria-hidden="true" data-hide-delay="100" data-show-delay="150">
      <div class="mdc-tooltip__surface mdc-tooltip__surface-animation">
        Word count
      </div>
    </div>
    <div class="wordcount-options" [class.hidden]="!isOpen()">
      @for (count of PRESET_COUNTS; track count) {
        <span
          [class.active]="wordCount() === count"
          (click)="handleCountSelect(count)"
        >
          {{ count }}
        </span>
      }
      @if (showCustomInput()) {
        <form class="custom-wordcount-form" (submit)="handleCustomSubmit($event)">
          <input
            #customInput
            type="number"
            min="5"
            max="500"
            [value]="customValue()"
            (input)="onCustomInput($event)"
            (keydown)="handleCustomKeyDown($event)"
            placeholder="5-500"
            class="custom-wordcount-input"
            (click)="stopPropagation($event)"
          />
        </form>
      } @else {
        <span
          class="custom-option"
          [class.active]="isCustomCount()"
          (click)="handleCustomClick($event)"
          aria-describedby="wordcount-settings-tooltip"
          data-tooltip-id="wordcount-settings-tooltip"
        >
          {{ isCustomCount() ? wordCount() : '&#9881;' }}
        </span>
        <div #settingsTooltipEl id="wordcount-settings-tooltip" class="mdc-tooltip" role="tooltip" aria-hidden="true" data-hide-delay="100" data-show-delay="150">
          <div class="mdc-tooltip__surface mdc-tooltip__surface-animation">
            Settings
          </div>
        </div>
      }
    </div>
  </div>
}
