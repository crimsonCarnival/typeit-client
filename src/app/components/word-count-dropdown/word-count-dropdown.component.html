@if (gameMode() === 'words') {
  <div class="tb-section">
    <span class="tb-label" aria-hidden="true">Words</span>
    <div class="tb-buttons" role="group" aria-label="Word count">
      @for (count of PRESET_COUNTS; track count) {
        <button type="button" class="tb-btn" [class.active]="wordCount() === count" [attr.aria-pressed]="wordCount() === count" [disabled]="isTyping()" (click)="handleCountSelect(count)">{{ count }}</button>
      }
      @if (showCustomInput()) {
        <form (submit)="handleCustomSubmit($event)">
          <input
            #customInput
            type="number"
            min="5"
            max="500"
            class="tb-input"
            aria-label="Custom word count (5 to 500)"
            placeholder="5-500"
            [value]="customValue()"
            (input)="onCustomInput($event)"
            (keydown)="handleCustomKeyDown($event)"
          />
        </form>
      } @else if (isCustomCount()) {
        <button type="button" class="tb-btn active" aria-pressed="true" aria-label="Custom word count, change" [disabled]="isTyping()" (click)="handleCustomClick($event)">{{ wordCount() }}</button>
      } @else {
        <button type="button" class="tb-btn tb-icon" aria-label="Custom word count" title="Custom word count" [disabled]="isTyping()" (click)="handleCustomClick($event)">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg>
        </button>
      }
    </div>
  </div>
}
