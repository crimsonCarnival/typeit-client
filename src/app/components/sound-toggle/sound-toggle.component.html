<div
  id="sound-toggle"
  class="toggle-icon"
  [class.active]="!isMuted()"
  [class.disabled]="disabled()"
  (click)="onClick()"
  aria-describedby="mute-tooltip"
  data-tooltip-id="mute-tooltip"
>
  <i class="fa-solid" [class.fa-volume-xmark]="isMuted()" [class.fa-volume-up]="!isMuted()"></i>
</div>

<div #tooltipEl id="mute-tooltip" class="mdc-tooltip" role="tooltip" aria-hidden="true" data-hide-delay="100" data-show-delay="150">
  <div class="mdc-tooltip__surface mdc-tooltip__surface-animation">
    {{ isMuted() ? 'Unmute sound' : 'Mute sound' }}
  </div>
</div>
